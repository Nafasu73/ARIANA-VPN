
name: Build ARIANA VPN

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find and extract project
        run: |
          ZIP_FILE=$(find . -type f -iname "*ARIANA*FIXED*.zip" -print -quit)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Fixed ZIP file not found!"
            exit 1
          fi
          mkdir -p project
          unzip -o "$ZIP_FILE" -d project

      - name: Fix Gradle file
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("project/app/build.gradle.kts")
          s = p.read_text()
          s = s.replace(r"\n", "\n")
          p.write_text(s)
          PY

      - name: Build APK
        run: gradle -p project :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ARIANA-VPN-APK
          path: project/app/build/outputs/apk/debug/*.apk
