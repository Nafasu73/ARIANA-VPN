name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  apk:
    name: Build Ariana VPN
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project
        run: |
          flutter create --org ir.zahranet --project-name app --platforms=android .
          rm -f android/app/src/main/kotlin/ir/zahranet/app/MainActivity.kt
          cp -r android_overlay/app/src/main/* android/app/src/main/

      - name: Build APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ArianaVPN-apk
          path: build/app/outputs/flutter-apk/app-release.apk
