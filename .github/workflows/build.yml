name: Build APK
on: [workflow_dispatch, push]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - name: Create Android project and apply overlay
        run: |
          flutter create --org ir.zahranet --project-name app --platforms=android .
          rm -f android/app/src/main/kotlin/ir/zahranet/app/MainActivity.kt
          cp -r android_overlay/app/src/main/* android/app/src/main/
          sed -i 's/minSdk = .*/minSdk = 26/; s/minSdkVersion .*/minSdkVersion 26/' android/app/build.gradle* || true
          cat >> android/app/build.gradle.kts <<'EOT'
          android { packaging { jniLibs { useLegacyPackaging = true } } }
          EOT
      - name: Fetch Aether core (arm64)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          gh release download -R CluvexStudio/Aether --pattern '*arm64*' --dir core || true
          ls -la core || true
          # Pick the Android/Linux arm64 build. If nothing matched, list assets and fail.
          F=$(ls core 2>/dev/null | grep -iE 'android|linux' | grep -viE 'sha256' | head -1)
          [ -n "$F" ] || { gh release view -R CluvexStudio/Aether --json assets -q '.assets[].name'; echo "No arm64 asset found: put the core in jniLibs manually"; exit 1; }
          case "$F" in
            *.zip) unzip -o "core/$F" -d core/x ;;
            *.tar.gz) mkdir -p core/x && tar -xzf "core/$F" -C core/x ;;
            *) mkdir -p core/x && cp "core/$F" core/x/ ;;
          esac
          BIN=$(find core/x -type f -iname 'aether*' ! -iname '*.sha256' | head -1)
          cp "$BIN" android/app/src/main/jniLibs/arm64-v8a/libaether.so
      - name: Build hev-socks5-tunnel
        run: |
          mkdir -p hev/jni && git clone --recursive --depth 1 https://github.com/heiher/hev-socks5-tunnel hev/jni
          cd hev && "$ANDROID_NDK_HOME/ndk-build" NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=jni/Android.mk APP_ABI=arm64-v8a APP_PLATFORM=android-26
          cp libs/arm64-v8a/libhev-socks5-tunnel.so ../android/app/src/main/jniLibs/arm64-v8a/
      - run: flutter build apk --release --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: ArianaVPN-apk
          path: build/app/outputs/flutter-apk/app-release.apk
