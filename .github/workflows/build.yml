name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  apk:
    name: Build Ariana VPN
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project
        run: |
          flutter create --org ir.zahranet --project-name app --platforms=android .
          rm -f android/app/src/main/kotlin/ir/zahranet/app/MainActivity.kt
          cp -r android_overlay/app/src/main/* android/app/src/main/
          mkdir -p android/app/libs
          cp android_overlay/app/libs/hev-socks5-tunnel.aar android/app/libs/
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle.kts")
          if not p.exists():
              p = Path("android/app/build.gradle")
          if not p.exists():
              raise SystemExit("ERROR: Android app Gradle file not found")

          s = p.read_text()
          dep = 'implementation(files("libs/hev-socks5-tunnel.aar"))'

          if "hev-socks5-tunnel.aar" not in s:
              marker = "dependencies {"
              if marker not in s:
                  raise SystemExit("ERROR: dependencies block not found")
              s = s.replace(marker, marker + "\n    " + dep, 1)
              p.write_text(s)

          if "hev-socks5-tunnel.aar" not in p.read_text():
              raise SystemExit("ERROR: HEV dependency was not added")

          print("SUCCESS: HEV dependency verified in", p)
          PY

      - name: Build APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ArianaVPN-apk
          path: build/app/outputs/flutter-apk/app-release.apk
